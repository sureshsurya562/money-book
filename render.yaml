services:
  - type: web
    name: money-book
    runtime: docker
    plan: free
    region: singapore
    branch: main
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /opt/render/project/src/data/money-book.db
      - key: JWT_SECRET
        generateValue: true
